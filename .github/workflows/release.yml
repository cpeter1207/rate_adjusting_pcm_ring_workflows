name: Verified shared-library release
on:
  workflow_call:
    inputs:
      code_ref:
        description: Immutable production revision to release.
        type: string
        required: true
      tag:
        description: Release tag.
        type: string
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  quality:
    uses: cpeter1207/rate_adjusting_pcm_ring_workflows/.github/workflows/quality.yml@main
    with:
      code_ref: ${{ inputs.code_ref }}
  binaries:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/cpeter1207/rpt-advanced-quality-debian${{ matrix.debian }}:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rate_adjusting_pcm_ring
          ref: ${{ inputs.code_ref }}
      - name: Assemble shared-library archive
        run: |
          version=${{ inputs.tag }}
          version=${version#v}
          soversion=${version%%.*}
          make clean VERSION="$version" all build/rate_adjusting_pcm_ring.pc
          mkdir release
          cp "build/librate_adjusting_pcm_ring.so.$version" release/
          ln -s "librate_adjusting_pcm_ring.so.$version" "release/librate_adjusting_pcm_ring.so.$soversion"
          ln -s "librate_adjusting_pcm_ring.so.$soversion" release/librate_adjusting_pcm_ring.so
          cp build/librate_adjusting_pcm_ring.a release/
          cp include/rate_adjusting_pcm_ring.h release/
          cp build/rate_adjusting_pcm_ring.pc release/
          tar -C release -czf rate_adjusting_pcm_ring-${{ inputs.tag }}-debian${{ matrix.debian }}-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: shared-library-debian${{ matrix.debian }}-${{ matrix.arch }}
          path: rate_adjusting_pcm_ring-${{ inputs.tag }}-debian${{ matrix.debian }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
  source:
    needs: quality
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rpt-advanced-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rate_adjusting_pcm_ring
          ref: ${{ inputs.code_ref }}
      - run: |
          version=${{ inputs.tag }}
          make VERSION="${version#v}" distcheck
      - uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: build/rate_adjusting_pcm_ring-*.tar.gz
          if-no-files-found: error
  publish:
    needs: [binaries, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rate_adjusting_pcm_ring
          ref: ${{ inputs.code_ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: shared-library-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" release/*.tar.gz --generate-notes --title "$TAG"
